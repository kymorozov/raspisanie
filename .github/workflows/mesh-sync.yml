name: МЭШ — домашние задания

on:
  schedule:
    - cron: '10 16 * * *'   # каждый день в 19:10 по Москве, когда учителя уже выложили ДЗ
  workflow_dispatch:         # ручной запуск: вкладка Actions или кнопка в приложении

permissions:
  contents: write

concurrency:
  group: mesh-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Выгрузка из МЭШ
        env:
          MESH_TOKEN: ${{ secrets.MESH_TOKEN }}
          MESH_PROFILE_ID: ${{ secrets.MESH_PROFILE_ID }}
          MESH_STUDENT_SASHA: ${{ secrets.MESH_STUDENT_SASHA }}
          MESH_STUDENT_VANYA: ${{ secrets.MESH_STUDENT_VANYA }}
        run: node scripts/mesh-sync.mjs

      - name: Сохранить в репозиторий
        run: |
          git config user.name "mesh-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/homework-mesh.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "МЭШ: домашние задания $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      # Если токен протух, задача краснеет — GitHub пришлёт письмо
      - name: Проверка токена
        run: |
          node -e "const s=require('./data/homework-mesh.json').status; if(!s.ok){console.error('МЭШ: '+s.error+' — '+(s.message||'')); process.exit(1)} if(s.tokenExp){const d=(new Date(s.tokenExp)-Date.now())/864e5; console.log('Токен действует ещё '+d.toFixed(1)+' дн.'); if(d<2) console.log('::warning::Токен МЭШ истекает через '+d.toFixed(1)+' дн. — обновите секрет MESH_TOKEN')}"
